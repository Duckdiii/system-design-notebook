<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="768" viewBox="0 0 1400 768">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
    <marker id="arrowIndigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4F46E5"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0D9488"/>
    </marker>
    <marker id="arrowSlate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#CBD5E1" opacity="0.45"/>
    </pattern>
  </defs>

  <rect width="1400" height="768" fill="#F8FAFC"/>
  <rect width="1400" height="768" fill="url(#dotGrid)"/>

  <!-- Header -->
  <rect x="44" y="22" width="1312" height="76" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="68" y="54" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="22" font-weight="800" fill="#0F172A">VERTICAL SCALING (SCALE UP) VS HORIZONTAL SCALING (SCALE OUT)</text>
  <text x="68" y="79" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13.5" font-weight="500" fill="#475569">Giai đoạn 0 · Mục 1.1 — So sánh cách mở rộng phần cứng một máy đơn và thêm nhiều máy chạy song song</text>
  
    <g>
      <rect x="1118" y="42" width="104" height="34" rx="8" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1"/>
      <text x="1170" y="63.375" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#4338CA" text-anchor="middle">SCALE UP</text>
    </g>
  
  
    <g>
      <rect x="1232" y="42" width="104" height="34" rx="8" fill="#F0FDFA" stroke="#99F6E4" stroke-width="1"/>
      <text x="1284" y="63.375" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0F766E" text-anchor="middle">SCALE OUT</text>
    </g>
  

  <!-- LEFT PANEL: VERTICAL SCALING -->
  <g filter="url(#shadow)">
    <rect x="44" y="116" width="636" height="562" rx="16" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="1.8"/>
    <path d="M 58 116 H 666 Q 680 116 680 130 V 124 H 44 V 130 Q 44 116 58 116 Z" fill="#4F46E5"/>
    <rect x="44" y="122" width="636" height="4" fill="#4F46E5"/>

    
    <g>
      <rect x="68" y="140" width="278" height="26" rx="6" fill="#4F46E5" stroke="#4F46E5" stroke-width="1"/>
      <text x="207" y="157.2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">VERTICAL SCALING · SCALE UP</text>
    </g>
  
    
    <g>
      <rect x="496" y="140" width="160" height="26" rx="6" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1"/>
      <text x="576" y="157.2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#4338CA" text-anchor="middle">1 máy mạnh hơn</text>
    </g>
  

    <text x="68" y="190" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#0F172A">Nâng cấp CPU, RAM, SSD trên cùng 1 Server duy nhất</text>

    <!-- Visual Canvas Left -->
    <rect x="68" y="206" width="588" height="318" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2"/>

    <!-- Users -> Small Server (Before) -->
    <text x="154" y="232" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11.5" font-weight="800" fill="#64748B" text-anchor="middle">TRƯỚC (Máy nhỏ)</text>
    <rect x="92" y="244" width="124" height="38" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.3"/>
    <text x="154" y="268" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">Users (~200 QPS)</text>
    <line x1="154" y1="282" x2="154" y2="334" stroke="#475569" stroke-width="2" marker-end="url(#arrowSlate)"/>

    <rect x="94" y="340" width="120" height="68" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.8" /><rect x="106" y="350" width="96" height="20" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/><circle cx="116" cy="360" r="3.2" fill="#10B981"/><line x1="126" y1="360" x2="192" y2="360" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/><rect x="106" y="378" width="96" height="20" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/><circle cx="116" cy="388" r="3.2" fill="#10B981"/><line x1="126" y1="388" x2="192" y2="388" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
    <text x="154" y="428" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">2 vCPU · 4 GB RAM</text>
    <text x="154" y="445" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11.5" fill="#64748B" text-anchor="middle">50 GB SSD</text>

    <!-- Upgrade Arrow -->
    <path d="M 232 374 H 294 L 294 316 H 352" fill="none" stroke="#4F46E5" stroke-width="3" marker-end="url(#arrowIndigo)"/>
    <rect x="236" y="330" width="114" height="42" rx="8" fill="#EEF2FF" stroke="#A5B4FC" stroke-width="1"/>
    <text x="293" y="348" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11.5" font-weight="800" fill="#4338CA" text-anchor="middle">↑ SCALE UP</text>
    <text x="293" y="364" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#4F46E5" text-anchor="middle">+CPU, +RAM, +NVMe</text>

    <!-- Upgraded Large Server (After) -->
    <text x="501" y="225" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11.5" font-weight="800" fill="#4338CA" text-anchor="middle">SAU (1 Máy Cấu Hình Khủng)</text>
    <rect x="374" y="234" width="254" height="36" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.3"/>
    <text x="501" y="257" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#312E81" text-anchor="middle">Users (~3,000 QPS)</text>
    <line x1="501" y1="270" x2="501" y2="294" stroke="#4F46E5" stroke-width="2.4" marker-end="url(#arrowIndigo)"/>

    <rect x="390" y="300" width="222" height="128" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.8" /><rect x="402" y="310" width="198" height="21" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/><circle cx="412" cy="320.5" r="3.2" fill="#10B981"/><line x1="422" y1="320.5" x2="590" y2="320.5" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/><rect x="402" y="339" width="198" height="21" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/><circle cx="412" cy="349.5" r="3.2" fill="#10B981"/><line x1="422" y1="349.5" x2="590" y2="349.5" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/><rect x="402" y="368" width="198" height="21" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/><circle cx="412" cy="378.5" r="3.2" fill="#10B981"/><line x1="422" y1="378.5" x2="590" y2="378.5" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/><rect x="402" y="397" width="198" height="21" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/><circle cx="412" cy="407.5" r="3.2" fill="#10B981"/><line x1="422" y1="407.5" x2="590" y2="407.5" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
    <text x="501" y="448" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="800" fill="#312E81" text-anchor="middle">64 vCPU · 256 GB RAM · 2 TB NVMe</text>

    <!-- Warning SPOF pill -->
    
    <g>
      <rect x="376" y="466" width="250" height="40" rx="8" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1"/>
      <text x="501" y="490.025" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#B91C1C" text-anchor="middle">⚠ SPOF (Chết 1 máy = Sập toàn bộ)</text>
    </g>
  
    
    <g>
      <rect x="90" y="466" width="260" height="40" rx="8" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1"/>
      <text x="220" y="490.025" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#B45309" text-anchor="middle">▲ Chạm trần phần cứng &amp; Giá đắt vọt</text>
    </g>
  

    <!-- Summary Left -->
    <rect x="68" y="540" width="588" height="118" rx="10" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1"/>
    <text x="86" y="564" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0F766E">✓ Ưu điểm: Rất đơn giản, giữ nguyên code, không cần đồng bộ mạng giữa các node.</text>
    <text x="86" y="590" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#B91C1C">✗ Nhược điểm: Có Single Point of Failure, downtime khi nâng cấp, giới hạn trần phần cứng.</text>
    <text x="86" y="616" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#312E81">★ Khi nào chọn: Giai đoạn đầu MVP, traffic vừa phải, hoặc DB quan hệ chưa cần shard.</text>
    <text x="86" y="642" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#475569">Ví dụ TechStore: Nâng máy PostgreSQL từ 2 vCPU / 4 GB RAM lên 16 vCPU / 64 GB RAM.</text>
  </g>

  <!-- RIGHT PANEL: HORIZONTAL SCALING -->
  <g filter="url(#shadow)">
    <rect x="720" y="116" width="636" height="562" rx="16" fill="#FFFFFF" stroke="#99F6E4" stroke-width="1.8"/>
    <path d="M 734 116 H 1342 Q 1356 116 1356 130 V 124 H 720 V 130 Q 720 116 734 116 Z" fill="#0D9488"/>
    <rect x="720" y="122" width="636" height="4" fill="#0D9488"/>

    
    <g>
      <rect x="744" y="140" width="294" height="26" rx="6" fill="#0D9488" stroke="#0D9488" stroke-width="1"/>
      <text x="891" y="157.2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">HORIZONTAL SCALING · SCALE OUT</text>
    </g>
  
    
    <g>
      <rect x="1162" y="140" width="170" height="26" rx="6" fill="#F0FDFA" stroke="#99F6E4" stroke-width="1"/>
      <text x="1247" y="157.2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#0F766E" text-anchor="middle">Nhiều máy song song</text>
    </g>
  

    <text x="744" y="190" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#0F172A">Thêm nhiều Server nhỏ chạy song song sau Load Balancer</text>

    <!-- Visual Canvas Right -->
    <rect x="744" y="206" width="588" height="318" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2"/>

    <!-- Users -->
    <rect x="938" y="218" width="200" height="36" rx="8" fill="#FFFFFF" stroke="#0D9488" stroke-width="1.4"/>
    <text x="1038" y="241" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#134E4A" text-anchor="middle">Users (10,000+ QPS)</text>
    <line x1="1038" y1="254" x2="1038" y2="278" stroke="#0D9488" stroke-width="2.2" marker-end="url(#arrowTeal)"/>

    <!-- Load Balancer -->
    <rect x="858" y="282" width="360" height="40" rx="8" fill="#0F766E" stroke="#0F766E"/>
    <text x="1038" y="306" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="800" fill="#FFFFFF" text-anchor="middle">LOAD BALANCER (Nginx / ALB) + Health Check</text>

    <!-- Lines from LB to 4 servers -->
    <path d="M 918 322 L 824 358" stroke="#0D9488" stroke-width="2" marker-end="url(#arrowTeal)"/>
    <path d="M 998 322 L 966 358" stroke="#0D9488" stroke-width="2" marker-end="url(#arrowTeal)"/>
    <path d="M 1078 322 L 1110 358" stroke="#EF4444" stroke-width="1.8" stroke-dasharray="4 3"/>
    <path d="M 1158 322 L 1252 358" stroke="#0D9488" stroke-width="2" marker-end="url(#arrowTeal)"/>

    <!-- 4 Parallel Servers -->
    <rect x="766" y="362" width="116" height="68" rx="10" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.8" /><rect x="778" y="372" width="92" height="20" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/><circle cx="788" cy="382" r="3.2" fill="#10B981"/><line x1="798" y1="382" x2="860" y2="382" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/><rect x="778" y="400" width="92" height="20" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/><circle cx="788" cy="410" r="3.2" fill="#10B981"/><line x1="798" y1="410" x2="860" y2="410" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
    <text x="824" y="447" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#134E4A" text-anchor="middle">App 1 (4 vCPU)</text>

    <rect x="908" y="362" width="116" height="68" rx="10" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.8" /><rect x="920" y="372" width="92" height="20" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/><circle cx="930" cy="382" r="3.2" fill="#10B981"/><line x1="940" y1="382" x2="1002" y2="382" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/><rect x="920" y="400" width="92" height="20" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/><circle cx="930" cy="410" r="3.2" fill="#10B981"/><line x1="940" y1="410" x2="1002" y2="410" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
    <text x="966" y="447" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#134E4A" text-anchor="middle">App 2 (4 vCPU)</text>

    <rect x="1052" y="362" width="116" height="68" rx="10" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.8" stroke-dasharray="5 3"/><rect x="1064" y="372" width="92" height="20" rx="4" fill="#FFFFFF" stroke="#FECACA" stroke-width="1"/><circle cx="1074" cy="382" r="3.2" fill="#EF4444"/><line x1="1084" y1="382" x2="1146" y2="382" stroke="#FCA5A5" stroke-width="2" stroke-linecap="round"/><rect x="1064" y="400" width="92" height="20" rx="4" fill="#FFFFFF" stroke="#FECACA" stroke-width="1"/><circle cx="1074" cy="410" r="3.2" fill="#EF4444"/><line x1="1084" y1="410" x2="1146" y2="410" stroke="#FCA5A5" stroke-width="2" stroke-linecap="round"/>
    <text x="1110" y="447" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#DC2626" text-anchor="middle">App 3 (Chết ✕)</text>

    <rect x="1194" y="362" width="116" height="68" rx="10" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.8" /><rect x="1206" y="372" width="92" height="20" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/><circle cx="1216" cy="382" r="3.2" fill="#10B981"/><line x1="1226" y1="382" x2="1288" y2="382" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/><rect x="1206" y="400" width="92" height="20" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/><circle cx="1216" cy="410" r="3.2" fill="#10B981"/><line x1="1226" y1="410" x2="1288" y2="410" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
    <text x="1252" y="447" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#134E4A" text-anchor="middle">App 4 (Auto +)</text>

    <!-- Shared Store & HA callout -->
    <rect x="766" y="466" width="320" height="40" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2"/>
    <text x="926" y="490" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">Shared State: Redis / DB (App phải Stateless)</text>
    
    <g>
      <rect x="1100" y="466" width="212" height="40" rx="8" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1"/>
      <text x="1206" y="490.025" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#047857" text-anchor="middle">✓ App 3 chết → Hệ vẫn chạy!</text>
    </g>
  

    <!-- Summary Right -->
    <rect x="744" y="540" width="588" height="118" rx="10" fill="#F0FDFA" stroke="#99F6E4" stroke-width="1"/>
    <text x="762" y="564" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0F766E">✓ Ưu điểm: Không có SPOF (High Availability), chịu lỗi tốt, mở rộng gần như vô hạn.</text>
    <text x="762" y="590" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#B45309">✗ Nhược điểm: Cần Load Balancer, buộc app phải Stateless (tách session ra Redis).</text>
    <text x="762" y="616" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#134E4A">★ Khi nào chọn: Hệ thống traffic lớn, yêu cầu SLA 99.9%+, cần auto-scale theo giờ cao điểm.</text>
    <text x="762" y="642" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#475569">Ví dụ TechStore (Lab 0.2): 3 instance Spring Boot sau Nginx LB, tắt 1 máy vẫn trả 200 OK.</text>
  </g>

  <!-- Footer -->
  <rect x="44" y="694" width="1312" height="50" rx="12" fill="#0F172A"/>
  <text x="700" y="724" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#F8FAFC" text-anchor="middle">💡 Nguyên tắc thực tế (Hybrid): Tầng App luôn ưu tiên Scale Out (Stateless + LB), còn Database thường Scale Up trước khi Replication / Sharding.</text>
</svg>
